# ENMAA website + its PostgreSQL database.
# Settings come from a .env file next to this file (copy .env.docker.example to .env).
# Test: http://<server-ip>:3006   ·   later: point Nginx Proxy Manager at http://enmaa-site:3000
name: enmaa

services:
  db:
    image: postgres:18-alpine
    container_name: enmaa-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: enmaa
      POSTGRES_USER: enmaa
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enmaa -d enmaa"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    image: enmaa-website
    container_name: enmaa-site
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://enmaa:${DB_PASSWORD}@db:5432/enmaa
      PORT: 3000
      BASE_URL: ${BASE_URL:-http://localhost:3006}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ANALYTICS_TZ: Africa/Tripoli
    ports:
      - "${WEB_PORT:-3006}:3000"
    volumes:
      - uploads:/app/uploads
      - app-data:/app/data
    # When the domain is ready, uncomment this and the "networks" block at the end, using the
    # network your Nginx Proxy Manager container is on (see: docker network ls).
    # networks: [default, proxy]

volumes:
  db-data:
  uploads:
  app-data:

